version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after: {count: 12, period: day}  
            error_after: {count: 4, period: day}  

# Warn if data is older than 12 hours
# Fail if data is older than 24 hours