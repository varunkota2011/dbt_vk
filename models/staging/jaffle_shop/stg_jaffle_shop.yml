version: 2

models:
  - name: stg_jaffle_shop_customers
    description: Stage customer data from our jaffle shop app.
    columns:
      - name: customer_id
        description: The primary key for customers table and validations for customers based on reqiurement.
        tests:
          - unique
          - not_null
  - name: stg_jaffle_shop_orders
    description: Stage order data from our jaffle shop app.
    columns:
      - name: order_id
        description: The primary key for orders table. 
        tests:
         - unique
         - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - return_pending
                  - placed
      - name: customer_id
        description: Foreign key to stg_customers.customer_id.
        tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop_customers')
                field: customer_id